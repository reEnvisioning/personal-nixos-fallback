# Horror theme — Backrooms × TBHK autumn warm glow

[mgr]
cwd = { fg = "#C48830", bold = true }
hovered = { reversed = true, bold = true }
preview_hovered = { underline = true }
find_keyword = { fg = "#F0B040", bold = true, italic = true, underline = true }
find_position = { fg = "#F0B040", bg = "reset", bold = true, italic = true }
marker_copied = { fg = "#7ABA5E", bg = "#7ABA5E" }
marker_cut = { fg = "#E86A4A", bg = "#E86A4A" }
marker_marked = { fg = "#F0C040", bg = "#F0C040" }
marker_selected = { fg = "#C48830", bg = "#C48830" }
count_copied = { fg = "#120E0A", bg = "#7ABA5E" }
count_cut = { fg = "#120E0A", bg = "#E86A4A" }
count_selected = { fg = "#120E0A", bg = "#C48830" }
border_symbol = "│"
border_style = { fg = "#C48830" }

[indicator]
padding = { open = "", close = "" }

[tabs]
active = { fg = "#120E0A", bg = "#D4A040", bold = true }
inactive = { fg = "#B0A090", bg = "#1A140E" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "#120E0A", bg = "#D4A040", bold = true }
normal_alt = { fg = "#B0A090", bg = "#1A140E" }
select_main = { fg = "#120E0A", bg = "#C48830", bold = true }
select_alt = { fg = "#C48830", bg = "#221A12" }
unset_main = { fg = "#120E0A", bg = "#F0B040", bold = true }
unset_alt = { fg = "#F0B040", bg = "#221A12" }

[status]
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }
progress_label = { fg = "#F0E0CC", bold = true }
progress_normal = { fg = "#F0B040", bg = "#2C1E14" }
progress_error = { fg = "#D4553A", bg = "#2C1E14" }
perm_sep = { fg = "#B0A090", bold = true }
perm_type = { fg = "#7AAECE" }
perm_read = { fg = "#C8B8A8", bold = true }
perm_write = { fg = "#E8A040", bold = true }
perm_exec = { fg = "#7AAECE", bold = true }

[pick]
border = { fg = "#C48830" }
active = { fg = "#E86A4A", bold = true }
inactive = {}

[input]
border = { fg = "#C48830" }
title = {}
value = {}
selected = { reversed = true }

[cmp]
border = { fg = "#C48830" }

[tasks]
border = { fg = "#C48830" }
title = {}
hovered = { fg = "#F0E0CC", underline = true }

[which]
mask = { bg = "#1A140E" }
cand = { fg = "#F0C040" }
rest = { fg = "#B0A090" }
desc = { fg = "#E86A4A" }
separator = "  "
separator_style = { fg = "#C48830" }

[help]
on = { fg = "#F0B040" }
run = { fg = "#E86A4A" }
desc = { fg = "#C8B8A8" }
hovered = { reversed = true, bold = true }
footer = { fg = "#F0E0CC", bg = "#120E0A" }

[notify]
title_info = { fg = "#7AAECE" }
title_warn = { fg = "#F0C040" }
title_error = { fg = "#E86A4A" }

[spot]
border = { fg = "#C48830" }
title  = {}
tbl_cell = { fg = "#C8B8A8", reversed = true }
tbl_col  = {}

[confirm]
border     = { fg = "#C48830" }
title      = {}
list       = {}
btn_yes    = { reversed = true }
btn_no     = {}
btn_labels = [ " [Y]es  ", "  (N)o  " ]

[filetype]
rules = [
  { mime = "image/*", fg = "#F0C040" },
  { mime = "{audio,video}/*", fg = "#F0A850" },
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#E86A4A" },
  { mime = "application/{pdf,doc,rtf}", fg = "#C48830" },
  { url = "*", fg = "#C8B8A8" },
  { url = "*/", fg = "#7AAECE" }
]
